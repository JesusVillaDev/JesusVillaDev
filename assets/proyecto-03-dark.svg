<text x="58.0" y="337.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5"><tspan fill="#9198A1" font-weight="600">Dinámica del trazo:</tspan><tspan fill="#6E7681"> Métricas de número de trazos, ritmo de dibujo, grosor y cobertura de lienzo.</tspan></text>
