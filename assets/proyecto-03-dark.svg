<text x="58" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5"><tspan fill="#E6EDF3" font-weight="600">Lienzo interactivo</tspan><tspan fill="#9198A1"> — Espacio de dibujo libre y plantillas para colorear con una interfaz colorida y amigable.</tspan></text>
