<style>.r{animation:fu .8s cubic-bezier(.2,.7,.3,1) both}.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.31s}.d4{animation-delay:.44s}.d5{animation-delay:.57s}@keyframes fu{from{opacity:0}to{opacity:1}}.rule{transform-box:fill-box;transform-origin:center;animation:gw .9s cubic-bezier(.2,.7,.3,1) .3s both}@keyframes gw{from{transform:scaleX(0)}to{transform:scaleX(1)}}.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}</style>
