<text x="697.0" y="242.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.0" fill="#3FB950" font-weight="700" text-anchor="middle" letter-spacing="1.6">DISPONIBLE</text>
