<text x="312.5" y="242.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.0" fill="#C9D1D9" font-weight="600" text-anchor="middle" letter-spacing="1.4">MICHOACÁN, MÉXICO</text>
<rect x="415.0" y="222.0" width="170.0" height="32.0" fill="#161B22" rx="16.0" stroke="#30363D" stroke-width="1"/>
<text x="500.0" y="242.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.0" fill="#C9D1D9" font-weight="600" text-anchor="middle" letter-spacing="1.4">ÚLTIMO SEMESTRE</text>
<rect x="600.0" y="222.0" width="175.0" height="32.0" fill="#161B22" rx="16.0" stroke="#238636" stroke-width="1.2"/>
